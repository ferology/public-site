<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Francesco Fera - UX Designer Portfolio</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- Intent Tracker — Visitor Intelligence -->
    <script>
    (function() {
      var SESSION_KEY = 'it_session';
      var API_BASE = 'https://intenttrack-heawpeez.manus.space/api/track';
      var sessionId = sessionStorage.getItem(SESSION_KEY );
      if (!sessionId) { sessionId = Math.random().toString(36).slice(2,18); sessionStorage.setItem(SESSION_KEY, sessionId); }
      var pageStart = Date.now(), clicks = 0;
      document.addEventListener('click', function(){ clicks++; });
      function getScrollDepth(){ var el=document.documentElement; var s=el.scrollTop||document.body.scrollTop; var t=el.scrollHeight-el.clientHeight; return t>0?Math.round(s/t*100):0; }
      function track(t){ fetch(API_BASE,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sessionId:sessionId,pageUrl:window.location.href,pageTitle:document.title,referrer:document.referrer||null,timeOnPageSeconds:t,scrollDepthPercent:getScrollDepth(),clickCount:clicks}),keepalive:true}); }
      track(0);
      window.addEventListener('beforeunload',function(){ track(Math.round((Date.now()-pageStart)/1000)); });
    })();
    </script>

  </body>
</html>
