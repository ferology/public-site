<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Francesco Fera - UX Designer Portfolio</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- Intent Tracker — Visitor Intelligence -->
    <script>
    (function() {
      var SESSION_KEY = 'it_session';
      var API_BASE = 'https://intenttrack-heawpeez.manus.space/api/trpc';
      var sessionId = sessionStorage.getItem(SESSION_KEY);
      if (!sessionId) {
        sessionId = Math.random().toString(36).slice(2, 18);
        sessionStorage.setItem(SESSION_KEY, sessionId);
      }
      var pageStart = Date.now();
      var clicks = 0;
      document.addEventListener('click', function() { clicks++; });
      function getScrollDepth() {
        var el = document.documentElement;
        var scrolled = el.scrollTop || document.body.scrollTop;
        var total = el.scrollHeight - el.clientHeight;
        return total > 0 ? Math.round((scrolled / total) * 100) : 0;
      }
      function track(timeOnPage) {
        fetch(API_BASE + '/visitor.track', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ json: {
            sessionId: sessionId,
            pageUrl: window.location.href,
            pageTitle: document.title,
            referrer: document.referrer || null,
            timeOnPageSeconds: timeOnPage,
            scrollDepthPercent: getScrollDepth(),
            clickCount: clicks
          }}),
          keepalive: true
        });
      }
      track(0);
      window.addEventListener('beforeunload', function() {
        track(Math.round((Date.now() - pageStart) / 1000));
      });
    })();
    </script>

  </body>
</html>
